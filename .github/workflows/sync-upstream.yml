name: Sync Upstream

on:
  schedule:
    # 每小时第 17 分钟自动检测并同步（避开整点拥堵）
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-sync:
    name: 自动同步上游 main
    if: github.repository == 'phhh-xh/EnsoCode'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check and merge upstream into main
        uses: actions/github-script@v8
        env:
          UPSTREAM_OWNER: J3n5en
          FORK_OWNER: phhh-xh
          REPO_NAME: EnsoCode
          BRANCH: main
          SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        with:
          script: |
            const { execFileSync } = require('child_process');

            const upstreamOwner = process.env.UPSTREAM_OWNER;
            const forkOwner = process.env.FORK_OWNER;
            const repoName = process.env.REPO_NAME;
            const branch = process.env.BRANCH;
            const token = (process.env.SYNC_TOKEN || '').trim();

            const getHeadSha = (owner) => {
              const out = execFileSync(
                'git',
                ['ls-remote', `https://github.com/${owner}/${repoName}.git`, `refs/heads/${branch}`],
                { encoding: 'utf8' }
              ).trim();
              const sha = out.split(/\s+/)[0];
              if (!sha) throw new Error(`无法读取 ${owner}/${repoName}:${branch} 的 HEAD SHA`);
              return sha;
            };

            const upstreamSha = getHeadSha(upstreamOwner);
            const forkSha = getHeadSha(forkOwner);
            core.info(`upstream=${upstreamSha.slice(0, 7)}, fork=${forkSha.slice(0, 7)}`);

            if (upstreamSha === forkSha) {
              core.info('已是最新，无需同步。');
              return;
            }

            const res = await fetch(`https://api.github.com/repos/${forkOwner}/${repoName}/merge-upstream`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ branch }),
            });

            const rawText = await res.text();
            let data = {};
            try {
              data = JSON.parse(rawText);
            } catch {}

            if (!res.ok) {
              core.setFailed(`同步失败（HTTP ${res.status}）：${data.message || rawText}`);
              return;
            }

            const newForkSha = getHeadSha(forkOwner);
            core.info(
              `✅ 已同步 ${forkOwner}/${repoName}:${branch} (${data.merge_type || 'unknown'}): ${forkSha.slice(0, 7)} -> ${newForkSha.slice(0, 7)}`
            );
